[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ckptscan"
version = "1.1.0"
description = "Scan model checkpoints for code that executes at load time"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "c01n31pan1c", email = "panic@c01n31.net"}]
dependencies = []

keywords = ["pickle", "checkpoint", "supply-chain", "security",
            "pytorch", "safetensors", "sarif"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://git.c01n31.net/c01n31pan1c/ckptscan"
Changelog = "https://git.c01n31.net/c01n31pan1c/ckptscan/-/blob/main/CHANGELOG.md"
[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]
keras = ["h5py"]
onnx = ["onnx"]
all = ["h5py", "onnx"]
[project.scripts]
ckptscan = "ckptscan.commands.main:main"
ckptscan-mkcorpus = "ckptscan.commands.mkcorpus:main"

[tool.setuptools.packages.find]
include = ["ckptscan*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
ckptscan = ["py.typed", "data/*.txt", "schema/*.json"]

[tool.mypy]
python_version = "3.11"
packages = ["ckptscan"]
strict = true
# The command modules are argparse glue; strict annotations there buy
# nothing and make the analysers harder to read.
exclude = "ckptscan/commands/"

[[tool.mypy.overrides]]
# Optional format readers. Their stubs are not worth a hard dependency.
module = ["h5py.*", "onnx.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["ckptscan"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
